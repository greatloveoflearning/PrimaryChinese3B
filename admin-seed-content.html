<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin: Seed Reading Articles + Vocab</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: 0.6rem 0 0.2rem; }
  input { font: inherit; padding: 0.4rem 0.6rem; width: 100%; box-sizing: border-box; }
  button { font: inherit; padding: 0.5rem 1rem; margin-top: 1rem; cursor: pointer; }
  #log { white-space: pre-wrap; background: #f3f3f3; padding: 1rem; margin-top: 1rem; font-family: monospace; font-size: 0.85rem; max-height: 400px; overflow: auto; }
</style>
</head>
<body>
<h1>Admin: Seed Reading Articles + Vocab (L10-L17)</h1>
<p>One-time tool to upload the 16 lesson reading articles (我爱阅读核心/深广, for the Typing Test) and the L10-L17 vocabulary list (for flashcards/match/practice) into Firestore. Delete this file (and <code>assets/content-seed-temp.js</code>) after use.</p>

<div id="login-box">
  <label>Email <input type="email" id="email"></label>
  <label>Password <input type="password" id="password"></label>
  <button id="login-btn">Sign in</button>
</div>

<div id="seed-box" hidden>
  <p id="whoami"></p>
  <button id="seed-btn">Seed articles + vocab into Firestore</button>
</div>

<div id="log"></div>

<script src="assets/vendor/firebase-vendor.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/firebase-init.js"></script>
<script src="assets/content-seed-temp.js"></script>
<script>
(function () {
  "use strict";
  const logEl = document.getElementById("log");
  function log(msg) {
    logEl.textContent += msg + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }

  function ready() {
    const { db, auth, sdk } = window.vocabFirebase || {};
    if (!sdk) {
      setTimeout(ready, 100);
      return;
    }

    sdk.onAuthStateChanged(auth, async (user) => {
      if (!user) {
        document.getElementById("login-box").hidden = false;
        document.getElementById("seed-box").hidden = true;
        return;
      }
      const snap = await sdk.getDoc(sdk.doc(db, "users", user.uid));
      const isAdmin = snap.exists() && snap.data().isAdmin === true;
      if (!isAdmin) {
        log(`Signed in as ${user.email}, but this account is not an admin.`);
        return;
      }
      document.getElementById("login-box").hidden = true;
      document.getElementById("seed-box").hidden = false;
      document.getElementById("whoami").textContent = `Signed in as admin: ${user.email}`;
    });

    document.getElementById("login-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await sdk.signInWithEmailAndPassword(auth, email, password);
        log(`Signed in as ${email}`);
      } catch (e) {
        log(`Sign-in failed: ${e.message}`);
      }
    });

    document.getElementById("seed-btn").addEventListener("click", async () => {
      document.getElementById("seed-btn").disabled = true;
      const data = window.CONTENT_SEED_DATA || {};

      try {
        await sdk.setDoc(sdk.doc(db, "typingArticlesMeta", "list"), { articles: data.typingArticlesMeta || [] });
        log(`✅ typingArticlesMeta/list: seeded ${(data.typingArticlesMeta || []).length} articles`);
      } catch (e) {
        log(`❌ typingArticlesMeta/list failed: ${e.message}`);
      }

      const content = data.typingArticleContent || {};
      for (const id of Object.keys(content)) {
        try {
          await sdk.setDoc(sdk.doc(db, "typingArticleContent", id), content[id]);
          log(`✅ typingArticleContent/${id}: seeded ${content[id].tokens.length} tokens`);
        } catch (e) {
          log(`❌ typingArticleContent/${id} failed: ${e.message}`);
        }
      }

      const vocabByLesson = data.vocabByLesson || {};
      for (const lesson of Object.keys(vocabByLesson)) {
        try {
          await sdk.setDoc(sdk.doc(db, "vocabData", lesson), { lesson: Number(lesson), words: vocabByLesson[lesson] });
          log(`✅ vocabData/${lesson}: seeded ${vocabByLesson[lesson].length} words`);
        } catch (e) {
          log(`❌ vocabData/${lesson} failed: ${e.message}`);
        }
      }

      log("Done. You can now delete admin-seed-content.html and assets/content-seed-temp.js from the repo.");
      document.getElementById("seed-btn").disabled = false;
    });
  }
  ready();
})();
</script>
</body>
</html>
